[package]
name = "bob-core"
version = "0.1.0"
edition = "2021"
publish = false
description = "núcleo do bob tudo"

[dependencies]
blake3 = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp"] }
jwalk = "0.8"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
